# CI/CD Pipeline
# Runs tests, linting, type checking, and security scans.
#
# Features:
#   - Standard quality checks (tests, linting, type checking)
#   - Security scanning (Bandit, Safety)
#   - Optional SonarCloud/Codecov integration
name: CI

on:
  merge_group:
  push:
    branches: [main, master, develop]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, master, develop]
  workflow_dispatch:

# Cancel in-progress runs for same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

# Uses org-level reusable workflow
jobs:
  ci:
    name: CI Pipeline
    uses: ByronWilliamsCPA/.github/.github/workflows/python-ci.yml@b7c661ec3bfeb04370ce3a9c748bd8c4e93bfe89  # main
    with:
      python-version: '3.12'
      coverage-threshold: 80
      source-directory: 'src'
      test-directory: 'tests'
      run-integration-tests: true
      run-security-tests: true
      fail-on-llm-tags: false
      # The reusable workflow defaults `no-build: true`, which fails with
      # "Distribution can't be installed because it is marked as --no-build
      # but has no binary distribution" for projects installed as
      # `editable+.`. Override to false so uv can build the package.
      no-build: false

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit tests with coverage
        run: npm run test:coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7
        with:
          files: frontend/coverage/lcov.info
          flags: frontend
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
      - name: Build
        run: npm run build

  # Runs the mocked-API Playwright suite (Tasks 1-9) against a production
  # build. The real-backend smoke tier (frontend/e2e-smoke/, Task 10) is
  # intentionally NOT run here: it needs a running Compose stack and
  # belongs in a separate, less-frequent workflow (nightly or pre-deploy).
  # That is an open, already-surfaced decision, not an oversight.
  frontend-e2e:
    name: Frontend E2E
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Get installed Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - name: Install Playwright OS dependencies (cache hit)
        run: npx playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'
      - name: Run e2e tests
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # D-06/S-22: the reusable python-ci.yml pipeline above has no PostgreSQL
  # service, so tests/integration/test_recommendation_measurement_postgres.py
  # (the only test gated on P1_DATABASE_URL) has always skipped in CI,
  # leaving partial index predicates, `SELECT ... FOR UPDATE`,
  # `gen_random_uuid()`, JSON semantics, FK enforcement, and server defaults
  # untested against the actual production engine. This job runs in this
  # repository (a reusable `uses:` job cannot also declare `services:`) with
  # a real postgres:16 service, applies migrations with `alembic upgrade
  # head`, then runs the integration-marked suite with P1_DATABASE_URL set
  # so that test actually executes instead of skipping. R2 adds the
  # `compare_metadata == []` schema-parity test in the same suite.
  postgres-integration:
    name: PostgreSQL Integration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fragrance_rater
          POSTGRES_PASSWORD: fragrance_rater_ci
          POSTGRES_DB: fragrance_rater
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://fragrance_rater:fragrance_rater_ci@localhost:5432/fragrance_rater
      P1_DATABASE_URL: postgresql+asyncpg://fragrance_rater:fragrance_rater_ci@localhost:5432/fragrance_rater
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --all-extras --frozen
      - name: Apply migrations
        run: uv run alembic upgrade head
      - name: Run PostgreSQL-gated integration tests
        # --no-cov: this job's job is PostgreSQL-only correctness, not
        # coverage; pyproject's addopts --cov-fail-under=80 would otherwise
        # fail every run of this small, single-directory suite outright.
        run: uv run pytest tests/integration -m integration -v --no-cov

  # Top-level gate that emits the bare "CI Gate" check name the org
  # ruleset requires. The reusable workflow's internal "CI Gate" job
  # surfaces as "CI Pipeline / CI Gate" because of the caller-job
  # prefix; this aggregate job re-publishes the same pass/fail signal
  # under the canonical name the ruleset matches on. Also gates on the
  # frontend and frontend-e2e jobs so a frontend lint/typecheck/test/build
  # or e2e failure blocks the same required check, not just the Python
  # pipeline.
  ci-gate:
    name: CI Gate
    needs: [ci, frontend, frontend-e2e, postgres-integration]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit
      - name: Aggregate CI result
        env:
          CI_RESULT: ${{ needs.ci.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          FRONTEND_E2E_RESULT: ${{ needs.frontend-e2e.result }}
          POSTGRES_RESULT: ${{ needs.postgres-integration.result }}
        run: |
          if [ "$CI_RESULT" != "success" ] || [ "$FRONTEND_RESULT" != "success" ] || [ "$FRONTEND_E2E_RESULT" != "success" ] || [ "$POSTGRES_RESULT" != "success" ]; then
            echo "::error::CI did not succeed (backend=$CI_RESULT, frontend=$FRONTEND_RESULT, frontend-e2e=$FRONTEND_E2E_RESULT, postgres=$POSTGRES_RESULT)"
            exit 1
          fi
          echo "CI Gate: all upstream checks succeeded."
