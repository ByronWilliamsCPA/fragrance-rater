# CI/CD Pipeline
# Runs tests, linting, type checking, and security scans.
#
# Features:
#   - Standard quality checks (tests, linting, type checking)
#   - Security scanning (Bandit, Safety)
#   - Optional SonarCloud/Codecov integration
name: CI

on:
  merge_group:
  push:
    branches: [main, master, develop]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, master, develop]
  workflow_dispatch:

# Cancel in-progress runs for same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

# Uses org-level reusable workflow
jobs:
  ci:
    name: CI Pipeline
    uses: ByronWilliamsCPA/.github/.github/workflows/python-ci.yml@cb0742cf00832b4e640a47dfca222047c2b70c1c  # main
    with:
      python-version: '3.12'
      coverage-threshold: 80
      source-directory: 'src'
      test-directory: 'tests'
      run-integration-tests: true
      run-security-tests: true
      fail-on-llm-tags: false
      # The reusable workflow defaults `no-build: true`, which fails with
      # "Distribution can't be installed because it is marked as --no-build
      # but has no binary distribution" for projects installed as
      # `editable+.`. Override to false so uv can build the package.
      no-build: false

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit tests with coverage
        run: npm run test:coverage
      - name: Build
        run: npm run build

  # Top-level gate that emits the bare "CI Gate" check name the org
  # ruleset requires. The reusable workflow's internal "CI Gate" job
  # surfaces as "CI Pipeline / CI Gate" because of the caller-job
  # prefix; this aggregate job re-publishes the same pass/fail signal
  # under the canonical name the ruleset matches on. Also gates on the
  # frontend job so a frontend lint/typecheck/test/build failure blocks
  # the same required check, not just the Python pipeline.
  ci-gate:
    name: CI Gate
    needs: [ci, frontend]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit
      - name: Aggregate CI result
        env:
          CI_RESULT: ${{ needs.ci.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: |
          if [ "$CI_RESULT" != "success" ] || [ "$FRONTEND_RESULT" != "success" ]; then
            echo "::error::CI did not succeed (backend=$CI_RESULT, frontend=$FRONTEND_RESULT)"
            exit 1
          fi
          echo "CI Gate: all upstream checks succeeded."
