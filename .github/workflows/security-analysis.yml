---
# Security Analysis Workflow
# Runs security scans including Bandit, Safety, and dependency checks.
#
# Features:
#   - Bandit static analysis for Python
#   - Safety dependency vulnerability scanning
#   - Weekly scheduled scans
name: Security Analysis

on:
  merge_group:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Run security scans weekly on Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

# Cancel in-progress runs for same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  pull-requests: write
  actions: read

# Uses org-level reusable workflow.
# Caller job is named "Security Analysis" so the reusable workflow's
# final "Security Gate Validation" job surfaces as the canonical
# "Security Analysis / Security Gate Validation" check the org ruleset
# requires.
jobs:
  security:
    name: Security Analysis
    uses: ByronWilliamsCPA/.github/.github/workflows/python-security-analysis.yml@987d517d3c8e4b180f4dd15de6d9575f0df91182  # main
    with:
      source-directory: 'src'
      python-version: '3.12'
      fail-on-high: true
      fail-on-medium: false
      run-codeql: true
      run-dependency-review: true
      run-bandit: true
      run-osv: true
      # Override reusable workflow's no-build: true default for projects
      # installed as `editable+.` (same fix pattern as ci.yml).
      no-build: false

  # Bare "Security Gate Validation" context required by the org ruleset.
  # The reusable security workflow surfaces as
  # "Security Analysis / Security Gate Validation" (caller / reusable job),
  # which cannot match the bare ruleset context. This in-line aggregator
  # re-emits the bare context on pull_request and inside the merge queue.
  security-gate:
    name: Security Gate Validation
    runs-on: ubuntu-latest
    needs: [security]
    if: always()
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: ''
      - name: Aggregate security result
        run: |
          result="${{ needs.security.result }}"
          if [ "$result" = "success" ] || [ "$result" = "skipped" ]; then
            echo "Security Gate Validation: passed (result: $result)"
          else
            echo "::error::Security Gate Validation failed: $result"
            exit 1
          fi
