---
# Security Analysis Workflow
# Runs security scans including Bandit, Safety, and dependency checks.
#
# Features:
#   - Bandit static analysis for Python
#   - Safety dependency vulnerability scanning
#   - Weekly scheduled scans
name: Security Analysis

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Run security scans weekly on Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

# Cancel in-progress runs for same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  pull-requests: write
  actions: read

# Uses org-level reusable workflow.
# Note: a reusable-workflow-caller job (one with `uses:`) always surfaces its
# inner jobs as "<caller job name> / <inner job name>", never the bare inner
# name. This caller therefore emits "Security Analysis / Security Gate
# Validation", not the bare "Security Gate Validation" the org's
# default-branch-baseline ruleset requires. See the security-gate-validation
# job below, which is a normal job (no `uses:`) added specifically to emit
# the bare context.
jobs:
  security:
    name: Security Analysis
    uses: ByronWilliamsCPA/.github/.github/workflows/python-security-analysis.yml@987d517d3c8e4b180f4dd15de6d9575f0df91182  # main
    with:
      source-directory: 'src'
      python-version: '3.12'
      fail-on-high: true
      fail-on-medium: false
      run-codeql: true
      run-dependency-review: true
      run-bandit: true
      run-osv: true
      # Override reusable workflow's no-build: true default for projects
      # installed as `editable+.` (same fix pattern as ci.yml).
      no-build: false

  # #CRITICAL: this job is the only source of the bare "Security Gate
  # Validation" required check; do not rename it or drop the needs: gate.
  # #ASSUME: the reusable workflow's own inner security-gate job (which this
  # depends on transitively via the "security" caller job's aggregate result)
  # continues to fail the "security" job on a real HIGH/CRITICAL finding.
  # #VERIFY: after a security finding lands, confirm this job goes red, not
  # just the "Security Analysis / Security Gate Validation" check.
  security-gate-validation:
    name: Security Gate Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [security]
    if: always()
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Check security analysis result
        env:
          SECURITY_RESULT: ${{ needs.security.result }}
        run: |
          if [ "$SECURITY_RESULT" = "success" ] || [ "$SECURITY_RESULT" = "skipped" ]; then
            echo "Security Gate Validation passed (Security Analysis: $SECURITY_RESULT)"
          else
            echo "::error::Security Gate Validation failed: Security Analysis result is $SECURITY_RESULT"
            exit 1
          fi
