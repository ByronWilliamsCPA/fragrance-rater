# Docker Publish - Calls Org-Level Reusable Workflow
#
# Builds the backend (FastAPI) and frontend (nginx) images and pushes both
# to GHCR once CI succeeds on main or master (workflow_run-gated, so a commit
# that breaks CI is never published). PR builds run the same jobs without
# pushing, so Trivy/SBOM feedback shows up before merge. workflow_dispatch is
# also accepted, restricted to main/master via the job-level `if:`.
#
# Distinct from container-security.yml, which builds a scan-only local image
# on every push/PR touching Dockerfile-adjacent files and never publishes.
name: Docker Publish

on:
  # #ASSUME: timing: workflow_run's default checkout ref is the branch tip at
  # run time, not necessarily the exact commit CI just validated (the called
  # python-docker.yml has no ref-override input). This mirrors release.yml's
  # identical, already-accepted tradeoff for PyPI publishing.
  # #VERIFY: acceptable given the narrow race window; revisit if a push
  # landing in that gap is ever observed publishing the wrong commit.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, master]
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'Dockerfile'
      - 'frontend/Dockerfile'
      - 'docker-compose*.yml'
      - '.dockerignore'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'frontend/package*.json'
      - 'src/**'
      - 'alembic/**'
      - 'frontend/src/**'
      - 'frontend/public/**'
      - 'frontend/nginx.conf'
      - 'frontend/index.html'
      - 'frontend/vite.config.*'
      - 'frontend/tsconfig*.json'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.event.pull_request.number || github.ref }}
  # Only pull-request runs cancel. A publish run cancelled between the push and
  # the signing job would leave a pushed image with no signature, so publish
  # runs queue behind each other instead.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # Required for the publish path (backend/frontend jobs write to GHCR); also
  # granted on PR/dispatch runs that never push, since the reusable workflow
  # does not expose a way to scope permissions per-branch.
  packages: write
  # Lets the reusable workflow's Trivy scan step upload SARIF results to the
  # Security tab, matching container-security.yml's identical grant.
  security-events: write
  # python-docker.yml's build job requests this (unused by this repo's own
  # steps, but a reusable workflow's job can only request permissions the
  # caller also grants). Omitting it fails the whole run at startup before
  # any job is created, with no per-step log to point at the cause.
  pull-requests: write

jobs:
  backend:
    name: Build & Push Backend Image
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' &&
        (github.ref_name == 'main' || github.ref_name == 'master')) ||
      github.event.workflow_run.conclusion == 'success'
    uses: ByronWilliamsCPA/.github/.github/workflows/python-docker.yml@79bf84c73af866a34f968262f2631f938c659d77  # main
    with:
      dockerfile: 'Dockerfile'
      context: '.'
      image-name: 'byronwilliamscpa/fragrance_rater'
      push: ${{ github.event_name != 'pull_request' }}
      tag-latest: true
      # Neither Dockerfile in this repo pulls from dhi.io (both build from
      # python:3.12-slim / node:22-alpine / nginx:alpine), so this step has
      # nothing to authenticate for. Disabling it removes the unnecessary
      # privileged login attempt entirely, rather than just scoping when its
      # credentials are passed: the pinned reusable workflow's DHI login step
      # has no continue-on-error, so passing it empty credentials (the prior
      # fix here) hard-fails the job instead of skipping cleanly.
      enable-dhi-login: false
      # #ASSUME: security: report-only by deliberate decision, not neglect.
      # container-security.yml (the advisory scan job) is also report-only
      # as of this PR, for the identical reason: the org's python-docker.yml
      # reusable workflow passes no `trivyignores` to its Trivy scan step,
      # so there is no way to accept a specific CVE here; turning this on
      # would block every future image publish on any CRITICAL/HIGH finding
      # with no recovery but reverting this line.
      # #VERIFY: revisit once python-docker.yml gains a suppression
      # mechanism, or once P6 pilot images are actually deployed and
      # exposed to real usage, whichever comes first.
      trivy-fail-on-vuln: false

  frontend:
    name: Build & Push Frontend Image
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' &&
        (github.ref_name == 'main' || github.ref_name == 'master')) ||
      github.event.workflow_run.conclusion == 'success'
    uses: ByronWilliamsCPA/.github/.github/workflows/python-docker.yml@79bf84c73af866a34f968262f2631f938c659d77  # main
    with:
      dockerfile: 'frontend/Dockerfile'
      context: './frontend'
      build-args: |
        VITE_API_URL=/api
        VITE_INSTRUMENT_VERSION=${{ github.sha }}
      image-name: 'byronwilliamscpa/fragrance_rater-frontend'
      push: ${{ github.event_name != 'pull_request' }}
      tag-latest: true
      # See the backend job's identical comment: this repo never needs DHI.
      enable-dhi-login: false
      # See the backend job's identical comment: no trivyignores escape
      # valve exists in python-docker.yml, so this stays report-only.
      trivy-fail-on-vuln: false

  # Keyless cosign signing (R14 PR 3b, architecture review finding S-12).
  #
  # The org reusable workflow python-docker.yml builds, scans and pushes but
  # does not sign, so signing happens here, after the push, by digest. A tag
  # can be re-pointed; a digest cannot, so a signature over the digest is the
  # thing a deployer can check. Each job gets `id-token: write` on its own so
  # no other job in this workflow can mint an OIDC token.
  #
  # Skipped on pull requests (nothing is pushed there) and whenever the build
  # job did not succeed or reported no digest.
  #
  # #CRITICAL: security: the signing identity a deployer verifies is this
  # file's path and the branch it ran on (see docs/deployment/image-signing.md).
  # Renaming this file or moving publishing off main invalidates every
  # documented `cosign verify` command.
  # #VERIFY: update the identity regexp in docs/deployment/image-signing.md
  # and tests/unit/test_image_pinning.py in the same change as any rename.
  sign-backend:
    name: Sign Backend Image
    needs: backend
    if: >-
      github.event_name != 'pull_request' &&
      needs.backend.result == 'success' &&
      needs.backend.outputs.image-digest != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE: ghcr.io/byronwilliamscpa/fragrance_rater
      DIGEST: ${{ needs.backend.outputs.image-digest }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: audit

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign image by digest
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      # A signature that does not verify is worse than none, because it reads
      # as protection. Verify with the exact identity a deployer will use.
      - name: Verify the signature just written
        env:
          REPO: ${{ github.repository }}
        run: |
          cosign verify \
            --certificate-identity-regexp "^https://github\.com/${REPO}/\.github/workflows/docker-publish\.yml@refs/heads/main$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE}@${DIGEST}"

  sign-frontend:
    name: Sign Frontend Image
    needs: frontend
    if: >-
      github.event_name != 'pull_request' &&
      needs.frontend.result == 'success' &&
      needs.frontend.outputs.image-digest != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE: ghcr.io/byronwilliamscpa/fragrance_rater-frontend
      DIGEST: ${{ needs.frontend.outputs.image-digest }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: audit

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign image by digest
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Verify the signature just written
        env:
          REPO: ${{ github.repository }}
        run: |
          cosign verify \
            --certificate-identity-regexp "^https://github\.com/${REPO}/\.github/workflows/docker-publish\.yml@refs/heads/main$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE}@${DIGEST}"
