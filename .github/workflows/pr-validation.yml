# PR Validation for Fragrance Rater
#
# Emits the three check names the org ruleset requires as bare top-level
# jobs (no reusable-workflow caller prefix):
#   - PR Title Format
#   - PR Body Non-Empty
#   - Dependency & Standards Validation
#
# These mirror the jobs in ByronWilliamsCPA/.github/.github/workflows/pr-validation.yml,
# inlined here because the org's pr-validation.yml is a standalone workflow
# (not workflow_call) so consumer repos must replicate the job definitions
# locally to land the same check names on their own PRs.
name: PR Validation

on:
  merge_group:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - main
      - master
      - develop

concurrency:
  # #ASSUME github.event.pull_request.number is null under merge_group;
  # fall back to github.ref (unique per merge-group ref) so a merge-group
  # build never collides with, or is cancelled by, a PR build's group.
  # #VERIFY confirm no cross-cancellation between a PR run and its
  # corresponding merge-group run after the first live merge-queue pass.
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  title-check:
    name: PR Title Format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # #CRITICAL github.event.pull_request.title is null under merge_group
    # (that event carries no pull_request payload); without this guard the
    # regex match below would run against an empty string and fail every
    # merge-group build. Restricting to pull_request makes this job report
    # "skipped" under merge_group instead, which
    # dependency-standards-validation below now accepts.
    # #VERIFY confirm this job shows "skipped", not absent or failed, on the
    # first live merge-group run.
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit
      - name: Validate conventional commit title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Conventional Commits: type(scope)!: description
          PATTERN='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^()]+\))?!?: .+'
          if echo "$PR_TITLE" | grep -qE "$PATTERN"; then
            echo "PR title follows Conventional Commits format."
          else
            echo "::error::PR title must follow Conventional Commits format."
            echo "::error::  Expected: type(scope): description"
            echo "::error::  Example:  feat(auth): add OAuth2 support"
            echo "::error::  Got: $PR_TITLE"
            exit 1
          fi

  body-check:
    name: PR Body Non-Empty
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # #CRITICAL github.event.pull_request.body is null under merge_group;
    # without this guard the empty-check below would fail every merge-group
    # build. Restricting to pull_request makes this job report "skipped"
    # under merge_group instead, which dependency-standards-validation below
    # now accepts.
    # #VERIFY confirm this job shows "skipped", not absent or failed, on the
    # first live merge-group run.
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit
      - name: Check PR body is non-empty
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ -z "$PR_BODY" ] || [ "$PR_BODY" = "null" ]; then
            echo "::error::PR description is empty. Please describe what this PR does."
            exit 1
          fi
          STRIPPED=$(echo "$PR_BODY" | tr -d '[:space:]')
          if [ -z "$STRIPPED" ]; then
            echo "::error::PR description contains only whitespace."
            exit 1
          fi
          echo "PR body is present."

  dependency-standards-validation:
    name: Dependency & Standards Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [title-check, body-check]
    if: always()
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit
      - name: Check dependency and standards requirements
        env:
          TITLE_RESULT: ${{ needs.title-check.result }}
          BODY_RESULT: ${{ needs.body-check.result }}
        run: |
          # #CRITICAL a required status check for the merge queue; a
          # merge_group build skips title-check/body-check by design (no PR
          # title/body to read there), so "skipped" is accepted here on top
          # of "success". A real "failure" under either event still fails
          # this gate, so the gate is not weakened, only made compatible
          # with the merge_group event.
          # #VERIFY watch the first live merge-group run to confirm this
          # context reports success instead of stalling the queue.
          ok() { [ "$1" = "success" ] || [ "$1" = "skipped" ]; }
          if ! ok "$TITLE_RESULT" || ! ok "$BODY_RESULT"; then
            echo "::error::PR validation checks failed: dependency and standards gate blocked."
            exit 1
          fi
          echo "Dependency and standards validation passed."
