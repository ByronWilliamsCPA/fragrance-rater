name: Postman API Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least-privilege token: workflow only reads the repo and uploads
# artifacts via the standard runner permissions.
permissions:
  contents: read

# Cancel superseded runs for the same ref to save CI minutes.
concurrency:
  group: postman-api-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  newman:
    name: Run Postman contract tests with Newman
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # The API refuses to start against a PostgreSQL session that is not UTC
    # (R8: assert_database_timezone_is_utc runs in the lifespan), so it needs
    # a reachable database even though the collection only asserts structure.
    services:
      postgres:
        image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
        env:
          POSTGRES_USER: fragrance_rater
          POSTGRES_PASSWORD: fragrance_rater_ci
          POSTGRES_DB: fragrance_rater
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # --------------------------------------------------------------------
    # Required GitHub Actions secrets (configure under
    # Settings -> Secrets and variables -> Actions):
    #
    #   OPENROUTER_API_KEY   - OpenRouter API key for production LLM
    #                          calls. NOT used by this workflow because
    #                          we boot the app with TEST_MODE=true, but
    #                          listed here so the same secret is
    #                          available to other workflows that hit
    #                          the live model.
    #
    # No secret is strictly required for this workflow because the
    # rating endpoint is stubbed via TEST_MODE=true (see below).
    # --------------------------------------------------------------------
    env:
      # TEST_MODE=true makes fragrance_rater.llm.client.LLMRatingClient
      # return a deterministic fixture instead of calling OpenRouter.
      # The Newman collection only asserts on response *structure*, so
      # the fixture is a safe stand-in and no OpenRouter key is required.
      TEST_MODE: "true"
      # FRAGRANCE_RATER_API_KEY: household API key required on POST /ratings
      # (see fragrance_rater.middleware.auth). This is a CI-only fixture
      # value, not a real secret; the Newman --env-var apiKey below must
      # match it so the "happy path" and "validation error" requests pass
      # the auth check and the "missing API key" request still gets 401.
      FRAGRANCE_RATER_API_KEY: "ci-fixture-key-not-a-secret"
      # CI-only fixture credentials for the throwaway service container above.
      DATABASE_URL: postgresql+asyncpg://fragrance_rater:fragrance_rater_ci@localhost:5432/fragrance_rater

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "latest"

      - name: uv sync
        run: uv sync --all-extras

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      - name: Install Newman
        run: npm install -g newman@6

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Start API in background (TEST_MODE stub)
        run: |
          # Start uvicorn detached. Logs go to api.log for debugging.
          nohup uv run uvicorn fragrance_rater.main:app \
            --host 127.0.0.1 --port 8000 > api.log 2>&1 &
          echo $! > api.pid

      - name: Wait for /health/live
        run: |
          # Poll the liveness probe until the server is ready. Fail
          # after ~30 seconds so a broken boot doesn't hang the job.
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health/live > /dev/null; then
              echo "API is up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::API did not become ready in 30s"
          cat api.log || true
          exit 1

      - name: Run Newman
        run: |
          newman run docs/api/postman-collection.json \
            --env-var baseUrl=http://127.0.0.1:8000 \
            --env-var apiKey="ci-fixture-key-not-a-secret" \
            --reporters cli,junit \
            --reporter-junit-export newman-report.xml

      - name: Upload Newman JUnit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: newman-report
          path: newman-report.xml
          if-no-files-found: ignore

      - name: Upload API log on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-log
          path: api.log
          if-no-files-found: ignore

      - name: Stop API
        if: always()
        run: |
          if [ -f api.pid ]; then
            kill "$(cat api.pid)" 2>/dev/null || true
          fi
