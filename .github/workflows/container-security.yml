# Container Security Scanning for Fragrance Rater
# Scans Docker images for vulnerabilities using Trivy and lints Dockerfile with Hadolint.
#
# This is a thin caller to the org-level reusable workflow.
name: Container Security

on:
  push:
    branches: [main, master]
    paths:
      - 'Dockerfile'
      - 'frontend/Dockerfile'
      - 'docker-compose*.yml'
      - '.dockerignore'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'frontend/package*.json'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'Dockerfile'
      - 'frontend/Dockerfile'
      - 'docker-compose*.yml'
      - '.dockerignore'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'frontend/package*.json'
  schedule:
    # Weekly scan on Wednesdays at 7 AM UTC
    - cron: '0 7 * * 3'
  workflow_dispatch:

# Cancel in-progress runs for same PR/branch
concurrency:
  group: container-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  packages: read

jobs:
  container-security:
    name: Container Security Scan (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            dockerfile: 'Dockerfile'
            context: '.'
            image-tag: 'fragrance_rater:scan'
          - name: frontend
            dockerfile: 'frontend/Dockerfile'
            context: './frontend'
            image-tag: 'fragrance_rater-frontend:scan'
    uses: ByronWilliamsCPA/.github/.github/workflows/python-container-security.yml@b7c661ec3bfeb04370ce3a9c748bd8c4e93bfe89  # main
    with:
      dockerfile-path: ${{ matrix.dockerfile }}
      build-context: ${{ matrix.context }}
      image-tag: ${{ matrix.image-tag }}
      build-image: true
      severity-threshold: 'CRITICAL,HIGH'
      # R1/S-10: gate on CRITICAL and HIGH ahead of the P6 go decision.
      # Accepted, unfixable base-image CVEs (there were ~18 transitive ones
      # on python:3.12-slim as of the 2026-09 architecture review) belong in
      # a dated .trivyignore.yaml entry (enforce-ignore-expiry below
      # requires a revisit date), not a blanket report-only mode.
      fail-on-vulnerabilities: true
      run-hadolint: true
      hadolint-failure-threshold: 'warning'
      generate-sbom: true
      upload-sarif: true
      artifact-retention-days: 90
    secrets: inherit
