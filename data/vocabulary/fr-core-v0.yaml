vocabulary:
  code: fr-core
  version: "0.1.0"
  owner: project
  status: draft
  license_id: project-owned
  provenance: >-
    Authored independently for fragrance-rater on 2026-09-24 from general perfumery
    vocabulary. Not derived from ScenTree's descriptor list or any licensed compilation.
terms:
  # Families (rank 0 only)
  - code: citrus
    kind: family
    label: Citrus
    definition: "Bright, juicy, and tangy, like peeling an orange or squeezing a lemon."
    active: true
  - code: floral
    kind: family
    label: Floral
    definition: "Smells of flowers, from a single rose to a full bouquet."
    active: true
  - code: fruity
    kind: family
    label: Fruity
    definition: "Smells of ripe fruit other than citrus, like berries, peaches, or apples."
    active: true
  - code: green
    kind: family
    label: Green
    definition: "Fresh and leafy, like snapped stems, crushed leaves, or a garden after mowing."
    active: true
  - code: aromatic
    kind: family
    label: Aromatic
    definition: "Herbal and fresh, like lavender, rosemary, mint, or a pot of kitchen herbs."
    active: true
  - code: spicy
    kind: family
    label: Spicy
    definition: "Warm or tingly, like the spice rack: pepper, cinnamon, clove, or ginger."
    active: true
  - code: woody
    kind: family
    label: Woody
    definition: "Smells of wood, whether dry and pencil-like, smooth and creamy, or dark and deep."
    active: true
  - code: resinous
    kind: family
    label: Resinous
    definition: "Sticky tree resins and balms, rich and glowing, like frankincense or a sticky pine cone."
    active: true
  - code: amber
    kind: family
    label: Amber
    definition: "Warm, sweet, and cozy, built from vanilla, resin, and soft spice glowing together."
    active: true
  - code: gourmand
    kind: family
    label: Gourmand
    definition: "Smells good enough to eat, like desserts, sweets, coffee, or baked treats."
    active: true
  - code: musky
    kind: family
    label: Musky
    definition: "Soft, clean, skin-like warmth that stays close, like freshly washed skin or laundry."
    active: true
  - code: animalic
    kind: family
    label: Animalic
    definition: "Warm, raw, bodily smells, like skin, sweat, fur, or a horse stable."
    active: true
  - code: leathery
    kind: family
    label: Leathery
    definition: "Smells of leather goods, from soft suede gloves to a new saddle."
    active: true
  - code: smoky
    kind: family
    label: Smoky
    definition: "Smells of smoke and fire, like a campfire, burning incense, or a blown-out match."
    active: true
  - code: earthy
    kind: family
    label: Earthy
    definition: "Damp and natural, like soil, moss, roots, or mushrooms on a forest walk."
    active: true
  - code: aquatic
    kind: family
    label: Aquatic
    definition: "Watery and airy, like sea spray, a cold stream, or a breezy day outdoors."
    active: true
  - code: mineral
    kind: family
    label: Mineral
    definition: "Stony, cool, and lifeless in a good way, like wet rocks, chalk, metal, or ink."
    active: true
  - code: aldehydic
    kind: family
    label: Aldehydic
    definition: "Bright, fizzy, and clean, like fresh soap, pressed linen, or a classic powdery perfume."
    active: true

  # Descriptors (ranks 1 to 5), grouped by usual_family_hint
  - code: tart
    kind: descriptor
    label: Tart
    usual_family_hint: citrus
    definition: "Sour and sharp, like lemon juice or a bite of lime."
    active: true
  - code: bitter-peel
    kind: descriptor
    label: Bitter peel
    usual_family_hint: citrus
    definition: "The bitter, oily bite of grapefruit or bitter orange peel and pith."
    active: true
  - code: sweet-orange
    kind: descriptor
    label: Sweet orange
    usual_family_hint: citrus
    definition: "Juicy and sweet, like a freshly peeled orange or tangerine."
    active: true

  - code: rosy
    kind: descriptor
    label: Rosy
    usual_family_hint: floral
    definition: "Smells like a fresh rose, from dewy and pink to deep and jammy."
    active: true
  - code: heady
    kind: descriptor
    label: Heady
    usual_family_hint: floral
    definition: "Rich, intense flowers like jasmine or tuberose that can fill a whole room."
    active: true
  - code: dewy-petals
    kind: descriptor
    label: Dewy petals
    usual_family_hint: floral
    definition: "Fresh, delicate flowers with a watery touch, like lily of the valley or wet petals."
    active: true
  - code: narcissus-green
    kind: descriptor
    label: Narcissus green
    usual_family_hint: floral
    definition: "A sharp, green, hay-like edge found in narcissus and paperwhites, more piercing than a soft bouquet."
    active: true
  - code: iris-powdery
    kind: descriptor
    label: Iris-powdery
    usual_family_hint: floral
    definition: "The cool, soft, dusty smell of iris, a little like raw carrot and face powder."
    active: true
  - code: violet
    kind: descriptor
    label: Violet
    usual_family_hint: floral
    definition: "Sweet, powdery flower smell, like violet sweets or old-fashioned lipstick."
    active: true
  - code: orange-blossom
    kind: descriptor
    label: Orange blossom
    usual_family_hint: floral
    definition: "Sweet, sunny, honey-like smell of the flowers on orange and lemon trees."
    active: true

  - code: red-berries
    kind: descriptor
    label: Red berries
    usual_family_hint: fruity
    definition: "Juicy berries like strawberry, raspberry, and cherry."
    active: true
  - code: stone-fruit
    kind: descriptor
    label: Stone fruit
    usual_family_hint: fruity
    definition: "Soft, fuzzy, ripe fruit like peach, apricot, or nectarine."
    active: true
  - code: tropical-fruit
    kind: descriptor
    label: Tropical fruit
    usual_family_hint: fruity
    definition: "Lush, sunny fruit like mango, pineapple, passion fruit, or coconut."
    active: true
  - code: orchard-fruit
    kind: descriptor
    label: Orchard fruit
    usual_family_hint: fruity
    definition: "Crisp, juicy fruit like apple, pear, or quince."
    active: true
  - code: jammy
    kind: descriptor
    label: Jammy
    usual_family_hint: fruity
    definition: "Cooked, dark, concentrated fruit, like plum jam, figs, or raisins."
    active: true
  - code: blackcurrant
    kind: descriptor
    label: Blackcurrant
    usual_family_hint: fruity
    definition: "Tart, dark berry with a sharp, leafy tang, like blackcurrant cordial."
    active: true

  - code: cut-stems
    kind: descriptor
    label: Cut stems
    usual_family_hint: green
    definition: "The sharp, sappy smell of snapped flower stems or a freshly mown lawn."
    active: true
  - code: leafy
    kind: descriptor
    label: Leafy
    usual_family_hint: green
    definition: "Crushed green leaves, like brushing past a tomato plant or rubbing a leaf."
    active: true
  - code: bitter-green
    kind: descriptor
    label: Bitter green
    usual_family_hint: green
    definition: "Piercing, bitter green, like snapped green beans or a raw green pepper."
    active: true
  - code: hay
    kind: descriptor
    label: Hay
    usual_family_hint: green
    definition: "Dry, sweet, sun-dried grass, like a hayloft or a fresh bale of straw."
    active: true
  - code: tea
    kind: descriptor
    label: Tea
    usual_family_hint: green
    definition: "Smells of tea leaves, from light green tea to dark, smoky black tea."
    active: true
  - code: cucumber-crisp
    kind: descriptor
    label: Cucumber-crisp
    usual_family_hint: green
    definition: "Cool, watery, crunchy freshness, like sliced cucumber or melon rind."
    active: true

  - code: lavender
    kind: descriptor
    label: Lavender
    usual_family_hint: aromatic
    definition: "Clean, herbal, slightly sweet smell of lavender flowers or a lavender sachet."
    active: true
  - code: minty
    kind: descriptor
    label: Minty
    usual_family_hint: aromatic
    definition: "Cool and refreshing, like peppermint, spearmint, or toothpaste."
    active: true
  - code: medicinal
    kind: descriptor
    label: Medicinal
    usual_family_hint: aromatic
    definition: "Sharp, clearing smell like eucalyptus, chest rub, or a first-aid cabinet."
    active: true
  - code: kitchen-herbs
    kind: descriptor
    label: Kitchen herbs
    usual_family_hint: aromatic
    definition: "Savory cooking herbs like rosemary, thyme, basil, or sage."
    active: true
  - code: pine-needle
    kind: descriptor
    label: Pine needle
    usual_family_hint: aromatic
    definition: "Fresh, sharp smell of crushed pine or fir needles, like a Christmas tree."
    active: true
  - code: anise
    kind: descriptor
    label: Anise
    usual_family_hint: aromatic
    definition: "Sweet licorice smell, like fennel seeds, star anise, or black jelly beans."
    active: true

  - code: peppery
    kind: descriptor
    label: Peppery
    usual_family_hint: spicy
    definition: "The tingly, sneezy bite of freshly ground black or pink pepper."
    active: true
  - code: baking-spice
    kind: descriptor
    label: Baking spice
    usual_family_hint: spicy
    definition: "Warm, sweet spices like cinnamon, clove, and nutmeg in a holiday bake."
    active: true
  - code: ginger-bright
    kind: descriptor
    label: Ginger-bright
    usual_family_hint: spicy
    definition: "Fresh, lively spice like grated ginger root or crushed cardamom pods."
    active: true
  - code: saffron
    kind: descriptor
    label: Saffron
    usual_family_hint: spicy
    definition: "Warm, dry spice with a leathery, honeyed edge, like saffron rice."
    active: true
  - code: cumin
    kind: descriptor
    label: Cumin
    usual_family_hint: spicy
    definition: "Warm, earthy spice that can smell a little like sweaty skin."
    active: true

  - code: cedar-dry
    kind: descriptor
    label: Cedar-dry
    usual_family_hint: woody
    definition: "Dry, crisp wood, like a freshly sharpened pencil or a cedar closet."
    active: true
  - code: sandalwood-creamy
    kind: descriptor
    label: Sandalwood-creamy
    usual_family_hint: woody
    definition: "Smooth, soft, milky wood, like sandalwood incense or a rich body lotion."
    active: true
  - code: oud
    kind: descriptor
    label: Oud
    usual_family_hint: woody
    definition: "Dark, deep, fermented wood that can smell medicinal, smoky, or like a barn."
    active: true
  - code: driftwood
    kind: descriptor
    label: Driftwood
    usual_family_hint: woody
    definition: "Pale, dry, sun-bleached wood with a salty, beachy feel."
    active: true
  - code: sheer-woods
    kind: descriptor
    label: Sheer woods
    usual_family_hint: woody
    definition: "Soft, airy, velvety modern wood that feels warm but is hard to pin down."
    active: true
  - code: radiant-amber-wood
    kind: descriptor
    label: Radiant amber-wood
    usual_family_hint: woody
    definition: "A soft, glowing mix of wood, amber, and musk that clings to skin, common in modern perfumes."
    active: true
  - code: old-paper
    kind: descriptor
    label: Old paper
    usual_family_hint: woody
    definition: "Dusty, slightly sweet smell of old books, a library, or a cardboard box."
    active: true

  - code: church-incense
    kind: descriptor
    label: Church incense
    usual_family_hint: resinous
    definition: "Sacred resin smoke, like frankincense burning in a church or temple."
    active: true
  - code: balsam-sweet
    kind: descriptor
    label: Balsam-sweet
    usual_family_hint: resinous
    definition: "Sticky, sweet, slightly cinnamon tree balm, like warm sap or old-fashioned cough drops."
    active: true
  - code: bitter-resin
    kind: descriptor
    label: Bitter resin
    usual_family_hint: resinous
    definition: "Dark, bitter, slightly medicinal resin, like myrrh."
    active: true

  - code: vanilla
    kind: descriptor
    label: Vanilla
    usual_family_hint: amber
    definition: "Sweet, creamy, comforting smell of vanilla pods or vanilla extract."
    active: true
  - code: cozy-warm
    kind: descriptor
    label: Cozy warm
    usual_family_hint: amber
    definition: "A soft, glowing warmth, like sitting by a fire wrapped in a blanket."
    active: true
  - code: tonka
    kind: descriptor
    label: Tonka
    usual_family_hint: amber
    definition: "Sweet warmth that smells of almond and hay, like marzipan with a touch of vanilla."
    active: true
  - code: tobacco
    kind: descriptor
    label: Tobacco
    usual_family_hint: amber
    definition: "Sweet, dried tobacco leaf, like an open pouch of pipe tobacco, not stale smoke."
    active: true

  - code: sugary
    kind: descriptor
    label: Sugary
    usual_family_hint: gourmand
    definition: "Plain sweetness, like cotton candy, caramel, or a bag of sweets."
    active: true
  - code: cocoa
    kind: descriptor
    label: Cocoa
    usual_family_hint: gourmand
    definition: "Dark, bittersweet smell of cocoa powder or chocolate."
    active: true
  - code: coffee
    kind: descriptor
    label: Coffee
    usual_family_hint: gourmand
    definition: "Roasted, bittersweet smell of freshly ground coffee beans."
    active: true
  - code: milky
    kind: descriptor
    label: Milky
    usual_family_hint: gourmand
    definition: "Soft, warm, creamy smell, like warm milk, custard, or fresh cream."
    active: true
  - code: nutty
    kind: descriptor
    label: Nutty
    usual_family_hint: gourmand
    definition: "Toasty nut smell, like almonds, hazelnuts, or pistachios."
    active: true
  - code: boozy
    kind: descriptor
    label: Boozy
    usual_family_hint: gourmand
    definition: "Smells of alcoholic drinks, like rum, cognac, whisky, or liqueur."
    active: true
  - code: rice-and-grain
    kind: descriptor
    label: Rice and grain
    usual_family_hint: gourmand
    definition: "Soft, toasty cereal smell, like steamed rice, oats, or warm toast."
    active: true
  - code: honey
    kind: descriptor
    label: Honey
    usual_family_hint: gourmand
    definition: "Thick, sweet, waxy honey that can turn warm and slightly animal."
    active: true

  - code: clean-laundry
    kind: descriptor
    label: Clean laundry
    usual_family_hint: musky
    definition: "The fresh, soft smell of laundry just out of the dryer."
    active: true
  - code: skin-close
    kind: descriptor
    label: Skin-close
    usual_family_hint: musky
    definition: "Soft, warm musk that smells like your own clean skin, only better."
    active: true
  - code: velvety
    kind: descriptor
    label: Velvety
    usual_family_hint: musky
    definition: "A soft, fuzzy, cushioning feel, like cashmere or the skin of a peach."
    active: true

  - code: barnyard
    kind: descriptor
    label: Barnyard
    usual_family_hint: animalic
    definition: "Raw farm smell of animals, stable straw, and hide."
    active: true
  - code: salty-skin
    kind: descriptor
    label: Salty skin
    usual_family_hint: animalic
    definition: "Warm skin with a salty, sun-soaked edge, like after a day at the beach."
    active: true
  - code: indolic
    kind: descriptor
    label: Indolic
    usual_family_hint: animalic
    definition: "A rich, slightly dirty, overripe edge, like heavy flowers such as jasmine left in a warm room."
    active: true
  - code: unwashed
    kind: descriptor
    label: Unwashed
    usual_family_hint: animalic
    definition: "Warm, lived-in body smell, like skin or hair a day after washing."
    active: true
  - code: ambergris
    kind: descriptor
    label: Ambergris
    usual_family_hint: animalic
    definition: "Soft, radiant, salty-sweet warmth, a little like the sea and a little like tobacco."
    active: true

  - code: suede
    kind: descriptor
    label: Suede
    usual_family_hint: leathery
    definition: "Soft, powdery, gentle leather, like suede gloves."
    active: true
  - code: saddle-leather
    kind: descriptor
    label: Saddle leather
    usual_family_hint: leathery
    definition: "Rich, polished leather, like a new saddle, handbag, or leather shoes."
    active: true
  - code: rubbery
    kind: descriptor
    label: Rubbery
    usual_family_hint: leathery
    definition: "Smells of rubber, like bike tires, a pencil eraser, or rain boots."
    active: true

  - code: campfire
    kind: descriptor
    label: Campfire
    usual_family_hint: smoky
    definition: "Burning wood smoke, like a campfire, fireplace, or smoked meat."
    active: true
  - code: tarry
    kind: descriptor
    label: Tarry
    usual_family_hint: smoky
    definition: "Thick, dark smell of tar, like fresh road asphalt or smoked leather."
    active: true
  - code: struck-match
    kind: descriptor
    label: Struck match
    usual_family_hint: smoky
    definition: "The sharp, sulfury flash of a just-struck match or a fired cap gun."
    active: true

  - code: mossy
    kind: descriptor
    label: Mossy
    usual_family_hint: earthy
    definition: "Damp, slightly bitter smell of moss growing on tree bark and stones."
    active: true
  - code: forest-floor
    kind: descriptor
    label: Forest floor
    usual_family_hint: earthy
    definition: "Damp fallen leaves and rotting wood, like a walk in the woods after rain."
    active: true
  - code: mushroom
    kind: descriptor
    label: Mushroom
    usual_family_hint: earthy
    definition: "Earthy, savory smell of fresh mushrooms or a damp cellar."
    active: true
  - code: rooty
    kind: descriptor
    label: Rooty
    usual_family_hint: earthy
    definition: "Dry or damp roots, like vetiver grass roots, raw carrot, or potato skins."
    active: true
  - code: wet-soil
    kind: descriptor
    label: Wet soil
    usual_family_hint: earthy
    definition: "Freshly dug or watered garden soil, like a flower pot after watering."
    active: true
  - code: patchouli
    kind: descriptor
    label: Patchouli
    usual_family_hint: earthy
    definition: "Dark, earthy, slightly sweet and damp leaf smell, familiar from 1970s perfume oils."
    active: true

  - code: sea-spray
    kind: descriptor
    label: Sea spray
    usual_family_hint: aquatic
    definition: "Fresh, salty sea air, like standing on a windy beach."
    active: true
  - code: open-air
    kind: descriptor
    label: Open air
    usual_family_hint: aquatic
    definition: "Crisp, clean outdoor air, like sheets dried on a line or the air before a storm."
    active: true
  - code: clear-water
    kind: descriptor
    label: Clear water
    usual_family_hint: aquatic
    definition: "Cool, clean, watery freshness, like a mountain stream or a glass of cold water."
    active: true
  - code: seaweed
    kind: descriptor
    label: Seaweed
    usual_family_hint: aquatic
    definition: "Salty, briny, iodine smell of seaweed and rock pools at low tide."
    active: true

  - code: wet-stone
    kind: descriptor
    label: Wet stone
    usual_family_hint: mineral
    definition: "Cool, clean smell of rain on warm pavement or river pebbles."
    active: true
  - code: chalky
    kind: descriptor
    label: Chalky
    usual_family_hint: mineral
    definition: "Dry, dusty, stony smell, like chalk, plaster, or a cool stone wall."
    active: true
  - code: metallic
    kind: descriptor
    label: Metallic
    usual_family_hint: mineral
    definition: "Cold, sharp smell of metal, like coins, keys, or a steel railing."
    active: true
  - code: ink
    kind: descriptor
    label: Ink
    usual_family_hint: mineral
    definition: "Smell of fountain-pen ink, fresh printing, or a new notebook."
    active: true

  - code: soapy
    kind: descriptor
    label: Soapy
    usual_family_hint: aldehydic
    definition: "Clean, bubbly smell of a fresh bar of soap."
    active: true
  - code: powdery
    kind: descriptor
    label: Powdery
    usual_family_hint: aldehydic
    definition: "Soft, dry, fine smell of face powder or baby powder."
    active: true
  - code: waxy
    kind: descriptor
    label: Waxy
    usual_family_hint: aldehydic
    definition: "Smooth, fatty smell of candle wax, crayons, or lipstick."
    active: true
  - code: sparkling
    kind: descriptor
    label: Sparkling
    usual_family_hint: aldehydic
    definition: "Fizzy, lifting brightness, like the first rush of champagne bubbles."
    active: true
  - code: sharp-chemical
    kind: descriptor
    label: Sharp chemical
    usual_family_hint: aldehydic
    definition: "Harsh, stinging sharpness, like nail polish remover, rubbing alcohol, or marker pens."
    active: true

