# Production overrides for docker-compose.yml
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  app:
    # Production image (pre-built)
    # image: ghcr.io/ByronWilliamsCPA/fragrance_rater:${VERSION:-latest}
    build:
      args:
        BUILD_ENV: production

    # Don't mount source code in production
    volumes: !reset []

    # The API is reachable only from the internal application network. All
    # client traffic enters through Traefik -> Authentik -> frontend nginx.
    ports: !reset []

    environment:
      ENVIRONMENT: production
      JSON_LOGS: "true"
      LOG_LEVEL: ${LOG_LEVEL:-WARNING}
      AUTHENTIK_REQUIRED: "true"
      # Host header values the API accepts (B-27): the public host nginx
      # forwards, plus localhost for the container healthcheck.
      TRUSTED_HOSTS: ${FRAGRANCE_HOST:?Set the production hostname},localhost,127.0.0.1
      # uvicorn takes the client address and scheme from X-Forwarded-For/-Proto
      # only from these peers (S-02): nginx on the private app network
      # (docker-compose.yml's fragrance_rater-network subnet) and Traefik on
      # the edge network. nginx resets both headers for any other peer.
      FORWARDED_ALLOW_IPS: 172.25.0.0/16,${FRAGRANCE_TRAEFIK_CIDR:?Set the authenticated-edge network subnet (CIDR)}
      CALIBRATION_ADMIN_USERNAMES: ${CALIBRATION_ADMIN_USERNAMES:?Set a JSON array of verified Authentik manager usernames}
      # JSON object of Authentik username -> fragrance house; empty grants no house access.
      HOUSE_CONTRIBUTORS: ${HOUSE_CONTRIBUTORS:-{}}
      HOUSE_CONTRIBUTOR_GROUP: ${HOUSE_CONTRIBUTOR_GROUP:-fragrance-houses}
      # The two secrets the billed endpoints need (S-04). Neither compose file
      # has an env_file, so a value that is not named here never reaches the
      # container and every billed endpoint answers 503. Both are required, so a
      # render without them fails here instead of in production. Supply them
      # from the secret store; never commit them.
      FRAGRANCE_RATER_API_KEY: ${FRAGRANCE_RATER_API_KEY:?Set the shared household API key}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?Set the OpenRouter API key}

    # Production replicas (for load balancing).
    # Defaults to 1: rate_limit.py's Limiter uses slowapi's default in-memory
    # storage, which is process-local. Scaling app beyond 1 replica splits
    # that counter per-instance, silently multiplying the effective rate
    # limit on the billed, LLM-backed POST /ratings endpoint (see
    # src/fragrance_rater/middleware/rate_limit.py). Set REPLICAS>1 only
    # after wiring the limiter to a shared backend (e.g.
    # storage_uri="redis://...").
    deploy:
      replicas: ${REPLICAS:-1}
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first

  frontend:
    # Production frontend (nginx serving built assets)
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        VITE_API_URL: /api
        # Same value as the app service's INSTRUMENT_VERSION, so the build the
        # evaluator sees is the build recorded on the program.
        VITE_INSTRUMENT_VERSION: ${INSTRUMENT_VERSION:-}
    image: fragrance_rater-frontend:${VERSION:-latest}
    environment:
      VITE_API_URL: /api
      # nginx forwards X-Authentik-* identity only from peers in this subnet,
      # the authenticated-edge network that holds just Traefik and this
      # frontend (architecture review S-01). Find it with:
      #   docker network inspect "$FRAGRANCE_TRAEFIK_NETWORK" \
      #     --format '{{(index .IPAM.Config 0).Subnet}}'
      FRAGRANCE_TRAEFIK_CIDR: ${FRAGRANCE_TRAEFIK_CIDR:?Set the authenticated-edge network subnet (CIDR)}
    volumes: !reset []
    # Do not retain the development host-port mapping. Traefik is the only
    # supported production entry point.
    ports: !reset []

    networks:
      - fragrance_rater-network
      # This external network must contain only Traefik and this frontend.
      # Do not reuse a shared proxy network with unrelated containers.
      - authenticated-edge

    labels:
      traefik.enable: "true"
      traefik.docker.network: ${FRAGRANCE_TRAEFIK_NETWORK:?Set the dedicated Traefik network name}
      traefik.http.routers.fragrance-rater.rule: Host(`${FRAGRANCE_HOST:?Set the production hostname}`)
      traefik.http.routers.fragrance-rater.entrypoints: websecure
      traefik.http.routers.fragrance-rater.tls: "true"
      traefik.http.routers.fragrance-rater.middlewares: ${AUTHENTIK_MIDDLEWARE:?Set the Authentik forward-auth middleware name}
      traefik.http.services.fragrance-rater.loadbalancer.server.port: "80"

    deploy:
      replicas: ${FRONTEND_REPLICAS:-1}
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  backup:
    # Scheduled database backup (architecture review D-18). The postgres image
    # has pg_dump, pg_restore, and psql; the script verifies each dump, writes a
    # checksum and manifest, prunes by age with a floor, and the healthcheck goes
    # unhealthy when backups stop succeeding. Backups land in the `backups`
    # volume on THIS host: copy them off-host (the operator's job; see
    # docs/deployment/backup-and-restore.md), and prove them with
    # scripts/verify_restore.py, because a dump that was never restored is not
    # yet a backup.
    image: postgres:16-alpine
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          /scripts/backup_database.sh backup || echo "backup failed" >&2
          sleep "$$((BACKUP_INTERVAL_HOURS * 3600))"
        done
    environment:
      PGHOST: db
      PGUSER: fragrance_rater
      PGDATABASE: fragrance_rater
      PGPASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in production}
      BACKUP_DIR: /backups
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_KEEP_MIN: ${BACKUP_KEEP_MIN:-3}
      BACKUP_MAX_AGE_HOURS: ${BACKUP_MAX_AGE_HOURS:-30}
    volumes:
      - ./scripts/backup_database.sh:/scripts/backup_database.sh:ro
      - backups:/backups
    networks:
      - fragrance_rater-network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/bin/sh", "/scripts/backup_database.sh", "check"]
      interval: 1h
      timeout: 10s
      retries: 1
      start_period: 10m
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  db:
    # Production database settings
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in production}

    # Do not expose the database to the network in production. The base
    # compose file publishes ${DB_PORT}:5432 on all interfaces for local
    # development; bind it to loopback here so production only reaches
    # Postgres over the internal compose network.
    ports: !reset []

    # Increased connection pool
    command: >
      postgres
      -c max_connections=100
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200

    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G

# =============================================================================
# Production Usage
# =============================================================================
# 1. Set environment variables in .env file or export them:
#    export DB_PASSWORD=secure-production-password
#    export SENTRY_DSN=your-sentry-dsn
#    export VERSION=v1.0.0
#
# 2. Start services:
#    docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# 3. Scale application (only after configuring a shared rate-limiter
#    backend; see the `deploy.replicas` comment on the `app` service above):
#    docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d --scale app=3
#
# 4. Monitor:
#    docker-compose -f docker-compose.yml -f docker-compose.prod.yml logs -f

volumes:
  # Database backups (see the `backup` service). Back this volume up off-host.
  backups:
    driver: local

networks:
  authenticated-edge:
    external: true
    name: ${FRAGRANCE_TRAEFIK_NETWORK:?Set the dedicated Traefik network name}
