# Pre-commit hooks configuration
# See https://pre-commit.com for more information
#
# Hook stages:
# - pre-commit: Fast checks on every commit (formatting, syntax, security)
# - pre-push: Full quality checks before pushing (Qlty, full scans)
# - commit-msg: Conventional commit message validation
#
# Installation: curl https://qlty.sh | bash
# Documentation: https://docs.qlty.sh

ci:
  autoupdate_schedule: monthly
  autofix_prs: true
  skip: [validate-front-matter, qlty-check, qlty-full, trufflehog, bandit, bandit-full]  # Skip local-only hooks

repos:
  # ============================================================================
  # Fast File Checks (Lightweight, run on every commit)
  # ============================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: "3e8a8703264a2f4a69428a0aa4dcb512790b2c8c"  # v6.0.0  # pragma: allowlist secret
    hooks:
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: check-yaml
        stages: [pre-commit]
        # These files use supported custom tags: MkDocs !ENV and Compose !reset.
        exclude: ^(mkdocs\.yml|docker-compose\.prod\.yml)$
      - id: check-json
        # TypeScript config files are JSONC and intentionally allow trailing commas.
        exclude: ^frontend/tsconfig\..*\.json$
        stages: [pre-commit]
      - id: check-toml
        stages: [pre-commit]
      - id: check-added-large-files
        args: ['--maxkb=10000']  # 10MB limit
        stages: [pre-commit]
      - id: check-merge-conflict
        stages: [pre-commit]
      - id: check-case-conflict
        stages: [pre-commit]
      - id: detect-private-key
        stages: [pre-commit]
      - id: mixed-line-ending
        args: ['--fix=lf']
        stages: [pre-commit]
      - id: debug-statements
        stages: [pre-commit]
      - id: check-executables-have-shebangs
        stages: [pre-commit]
      - id: check-shebang-scripts-are-executable
        stages: [pre-commit]

  # ============================================================================
  # Code Formatting and Linting
  # ============================================================================
  # Ruff: Fast Python linter + formatter (replaces black, isort, flake8, etc.)
  # Configuration in pyproject.toml [tool.ruff]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "321478e58f4938179c6b86e4ddfa923d1547a49b"  # v0.16.6  # pragma: allowlist secret
    hooks:
      - id: ruff
        name: Ruff lint
        stages: [pre-commit]
      - id: ruff-format
        name: Ruff format
        stages: [pre-commit]
        # v0.16.6 expanded the upstream default types_or to include
        # "markdown", so ruff-format now reformats fenced ```python blocks
        # inside every .md file touched by a commit. That is an unreviewed
        # scope expansion for a hook whose job is Python source formatting;
        # pin the historic scope until markdown-snippet formatting is
        # adopted deliberately (its own commit, reviewed diff).
        types_or: [python, pyi, jupyter]

  # ============================================================================
  # Secret Detection - TruffleHog
  # ============================================================================
  # Advanced secret detection beyond detect-private-key
  # Detects API keys, tokens, credentials, and other secrets
  # Uses local system-installed trufflehog to avoid Go build issues
  # Install: brew install trufflehog (macOS) or see https://github.com/trufflesecurity/trufflehog#installation
  - repo: local
    hooks:
      - id: trufflehog
        name: TruffleHog Secret Scanner
        description: Detect secrets in your data before committing
        # Scan staged files only. The git-history mode (--since-commit HEAD) also
        # traverses fetched remote branches in the local object store, producing
        # false positives from unmerged branches. Staged-file scanning is the
        # correct scope for a pre-commit hook; git history scanning belongs in CI.
        entry: >-
          bash -c
          'if ! command -v trufflehog >/dev/null 2>&1; then
            echo "ERROR: trufflehog (Go) not installed. This hook requires the trufflesecurity binary; trufflehog3 has an incompatible CLI and is not a drop-in. Install with: brew install trufflehog (macOS); curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b /usr/local/bin (Linux/WSL); or see https://github.com/trufflesecurity/trufflehog#installation" >&2;
            exit 1;
          fi;
          git diff --cached -z --diff-filter=d --name-only 2>/dev/null | xargs -0 -r trufflehog filesystem --fail --no-update --results=verified,unknown'
        language: system
        pass_filenames: false
        stages: [pre-commit]

  # ============================================================================
  # Security Scanning - Bandit
  # ============================================================================
  # Dedicated Bandit hook for Python security analysis
  # Runs on changed files during pre-commit, full scan on pre-push
  # Configuration in pyproject.toml [tool.bandit]
  - repo: https://github.com/PyCQA/bandit
    rev: "92ae8b82fb422a639f0ed8d99e96cea769594e08"  # 1.9.4  # pragma: allowlist secret
    hooks:
      - id: bandit
        name: Bandit Security Scan (changed files)
        args: ['-c', 'pyproject.toml', '-ll']  # Medium+ severity only
        stages: [pre-commit]
        exclude: ^(tests|scripts|benchmarks|tools|fuzz)/

  # Full Bandit scan on pre-push (catches all issues before PR)
  - repo: local
    hooks:
      - id: bandit-full
        name: Bandit Security Scan (full src/)
        entry: uv run bandit -c pyproject.toml -r src/ -ll -q
        language: system
        pass_filenames: false
        stages: [pre-push]
        always_run: true

  # ============================================================================
  # Type Checking - BasedPyright
  # ============================================================================
  # BasedPyright for strict Python type checking
  # Configuration in pyproject.toml [tool.basedpyright]
  # Note: Must be a local system hook (not remote repo) because the remote
  # repo does not ship .pre-commit-hooks.yaml
  - repo: local
    hooks:
      - id: basedpyright
        name: BasedPyright type checker
        entry: uv run --no-sync basedpyright src/
        language: system
        pass_filenames: false
        stages: [pre-commit]

  # ============================================================================
  # Conventional Commits Enforcement
  # ============================================================================
  # Enforces conventional commit message format for semantic versioning
  - repo: https://github.com/commitizen-tools/commitizen
    rev: "3d7386012109c403d56375314125c20e102e75c0"  # v4.18.0  # pragma: allowlist secret
    hooks:
      - id: commitizen
        stages: [commit-msg]

  # ============================================================================
  # pyproject.toml Validation
  # ============================================================================
  - repo: https://github.com/abravalheri/validate-pyproject
    rev: "17e12779811926f000bdfa1795f9e3735dd71ac3"  # 0.26  # pragma: allowlist secret
    hooks:
      - id: validate-pyproject
        stages: [pre-commit]

  # ============================================================================
  # GitHub Workflow Validation
  # ============================================================================
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: "c4654a7e007c9619a5eb63c39a456572a0fa1851"  # 0.38.0  # pragma: allowlist secret
    hooks:
      - id: check-github-workflows
        stages: [pre-commit]

  # ============================================================================
  # YAML Linting
  # ============================================================================
  # Yamllint validates YAML syntax and style
  # Configuration in .yamllint
  - repo: https://github.com/adrienverge/yamllint
    rev: "cba56bcde1fdd01c1deb3f945e69764c291a6530"  # v1.38.0  # pragma: allowlist secret
    hooks:
      - id: yamllint
        stages: [pre-commit]

  # ============================================================================
  # Qlty Unified Quality Checks (Pre-Push)
  # ============================================================================
  # Moved to pre-push to avoid clogging PR reviews with issues
  # Qlty runs all quality tools in a single pass:
  # - Ruff (linting + formatting)
  # - BasedPyright (type checking)
  # - Gitleaks (secrets detection)
  # - Markdownlint (markdown linting)
  # - Yamllint (YAML linting)
  # - OSV Scanner (dependency vulnerabilities)
  # - Code smells and complexity analysis
  #
  # Configure via .qlty/qlty.toml
  # Install: curl https://qlty.sh | bash && qlty plugins install
  - repo: local
    hooks:
      - id: qlty-check
        name: Qlty Code Quality Check (changed files)
        entry: >-
          bash -c "command -v qlty >/dev/null 2>&1 && qlty check --filter=diff || (echo 'ERROR: qlty not installed. Install via https://qlty.sh: curl https://qlty.sh | bash' >&2 && exit 1)"
        language: system
        types: [file]
        pass_filenames: false
        stages: [pre-push]
        verbose: true

      - id: qlty-full
        name: Qlty Full Quality Check (all files)
        entry: >-
          bash -c "command -v qlty >/dev/null 2>&1 && qlty check src/ || (echo 'ERROR: qlty not installed. Install via https://qlty.sh: curl https://qlty.sh | bash' >&2 && exit 1)"
        language: system
        pass_filenames: false
        stages: [pre-push]
        verbose: true


  # ============================================================================
  # Content Quality: Forbid Em-Dash
  # ============================================================================
  # Em-dashes (U+2014) are banned in all project output per global writing
  # standards. See ~/.claude/CLAUDE.md "Writing style". Implemented in pure
  # Python via `language: python` for portability across GNU/BSD systems
  # (the previous `grep -P` entry required GNU grep PCRE support).
  - repo: local
    hooks:
      - id: no-em-dash
        name: Forbid em-dash characters
        language: python
        entry: python
        args:
          - -c
          - |
            import sys
            offenders = []
            for path in sys.argv[1:]:
                try:
                    with open(path, encoding="utf-8", errors="ignore") as fh:
                        for lineno, line in enumerate(fh, 1):
                            if chr(0x2014) in line:
                                offenders.append(f"{path}:{lineno}")
                except OSError as exc:
                    sys.stderr.write(
                        f"WARNING: no-em-dash hook could not read {path}: {exc}\n"
                    )
                    continue
            if offenders:
                sys.stderr.write(
                    "ERROR: em-dash (U+2014) found at:\n  "
                    + "\n  ".join(offenders)
                    + "\nUse comma, semicolon, colon, or restructure.\n"
                )
                sys.exit(1)
        types: [text]
        exclude: ^(\.standards/.*|LICENSES/.*|.*\.svg|.*\.lock)$

  # ============================================================================
  # Custom Documentation Validation
  # ============================================================================
  - repo: local
    hooks:
      - id: validate-front-matter
        name: Validate documentation front matter
        entry: python tools/validate_front_matter.py docs
        language: python
        files: ^docs/(?!planning/).*\.md$
        pass_filenames: false
        stages: [pre-commit]
        additional_dependencies:
          - python-frontmatter>=1.1.0
          - pydantic>=2.0
          - ruamel.yaml>=0.18


  # ============================================================================
  # Python Docstring Coverage
  # ============================================================================
  # Interrogate ensures all Python code has proper docstrings
  # Target: 85% coverage
  - repo: https://github.com/econchick/interrogate
    rev: "a6268877efd41a21197445cc04cbf28f9c6facba"  # 1.7.0  # pragma: allowlist secret
    hooks:
      - id: interrogate
        args: ['-v', '-c', 'pyproject.toml', 'src/']
        language_version: python3.12
        pass_filenames: false
        stages: [pre-commit]

  # ============================================================================
  # Docstring Argument Validation
  # ============================================================================
  # Pydoclint validates that docstring arguments match function signatures
  # Configuration in pyproject.toml [tool.pydoclint]
  - repo: https://github.com/jsh9/pydoclint
    rev: cf8f4d0b81f933ebc5414acadcf7acdab705baa1  # 0.9.1  # pragma: allowlist secret
    hooks:
      - id: pydoclint
        args: ["--config=pyproject.toml"]
        types: [python]
        stages: [pre-commit]
        exclude: ^(tests|scripts|benchmarks|tools|docs)/

  # ============================================================================
  # Markdown Linting
  # ============================================================================
  # Markdownlint enforces markdown syntax and style consistency
  # Configuration in .markdownlint.json
  # Baseline compatibility: .markdownlintignore excludes legacy/template docs
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: "5b5dddc4fb0f83c3ea1fc5616fa63e115dce83e0"  # v0.49.1  # pragma: allowlist secret
    hooks:
      - id: markdownlint
        stages: [pre-commit]

# Exclude patterns
exclude: |
  (?x)^(
      \.git/|
      \.venv/|
      venv/|
      build/|
      dist/|
      .*\.egg-info/|
      __pycache__/|
      \.mypy_cache/|
      \.pytest_cache/|
      \.ruff_cache/|
      data/|
      models/|
      .*\.pyc
  )$
