# Rendered at container start by the nginx image's envsubst step
# (/etc/nginx/templates -> /etc/nginx/conf.d), which substitutes only
# environment variables that are set, so nginx's own $variables survive.
#
# #CRITICAL: security: the API trusts X-Authentik-* as the caller's verified
# identity (ADR-008). Traefik's Authentik forward-auth middleware sets those
# headers, replacing any a client sent. Any other peer that can reach this
# container (a sibling on a shared network, a misrouted request) could send
# them forged, so they are forwarded only when the connecting peer is inside
# FRAGRANCE_TRAEFIK_CIDR, the authenticated-edge network that holds only
# Traefik and this frontend (architecture review S-01). From any other peer
# they are cleared: an empty proxy_set_header value omits the header, and the
# API answers 401.
# #VERIFY: docs/deployment/p1-release-readiness.md (P1.6) sends a forged
# header from a container outside that subnet and expects 401.
geo $edge_peer_trusted {
    default                    0;
    ${FRAGRANCE_TRAEFIK_CIDR}  1;
}

map $edge_peer_trusted $edge_authentik_username {
    1        $http_x_authentik_username;
    default  "";
}

map $edge_peer_trusted $edge_authentik_uid {
    1        $http_x_authentik_uid;
    default  "";
}

map $edge_peer_trusted $edge_authentik_email {
    1        $http_x_authentik_email;
    default  "";
}

# Traefik's X-Forwarded-For / -Proto describe the real client and scheme;
# keep them only from Traefik so uvicorn's --proxy-headers (which trusts this
# container) cannot be fed a client-chosen address or scheme (S-02).
map $edge_peer_trusted $edge_forwarded_for {
    1        $proxy_add_x_forwarded_for;
    default  $remote_addr;
}

map $edge_peer_trusted $edge_forwarded_proto {
    1        $http_x_forwarded_proto;
    default  $scheme;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json
        image/svg+xml;

    # SPA routing - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Don't cache HTML
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Health check endpoint
    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
        access_log off;
    }

    # Authenticated production traffic reaches the API through this internal
    # proxy; the API has no production host-port mapping. Identity and
    # forwarding headers come from the maps above, never straight from the
    # request, so only Traefik can set them.
    location /api/ {
        proxy_pass http://app:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $edge_forwarded_for;
        proxy_set_header X-Forwarded-Proto $edge_forwarded_proto;
        proxy_set_header X-Authentik-Username $edge_authentik_username;
        proxy_set_header X-Authentik-Uid $edge_authentik_uid;
        proxy_set_header X-Authentik-Email $edge_authentik_email;
        proxy_pass_request_headers on;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Error pages
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
